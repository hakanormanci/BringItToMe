<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Market2 – Worker</title>
  <style>
    :root { --bg:#f5f5f5; --card:#fff; --pri:#1b5e20; --sec:#e8f5e9; --mut:#666; --danger:#c62828; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
           background:var(--bg); color:#222; font-size:16px; }
    header { background:var(--pri); color:#fff; padding:12px 16px; position:sticky; top:0; z-index:5;
             display:flex; gap:12px; align-items:center; }
    header h1 { font-size:18px; margin:0; flex:1; }
    .tabs { display:flex; gap:8px; }
    .tabs button { background:rgba(255,255,255,.15); color:#fff; border:0; padding:6px 10px;
                   border-radius:8px; font-size:13px; }
    .tabs button.active { background:#fff; color:var(--pri); font-weight:600; }
    main { padding:12px; max-width:640px; margin:0 auto; }
    .card { background:var(--card); border-radius:12px; padding:12px; margin-bottom:10px;
            box-shadow:0 1px 3px rgba(0,0,0,.08); }
    .row { display:flex; justify-content:space-between; align-items:center; gap:8px; }
    .muted { color:var(--mut); font-size:13px; }
    .lang { font-size:11px; background:var(--sec); color:var(--pri); padding:2px 6px; border-radius:6px; }
    .badge { font-size:11px; padding:2px 6px; border-radius:6px; background:#eee; color:#444; }
    .btn { border:0; border-radius:10px; padding:10px 14px; font-size:15px; font-weight:600;
           background:var(--pri); color:#fff; cursor:pointer; }
    .btn.sec { background:var(--sec); color:var(--pri); }
    .btn.danger { background:var(--danger); }
    .btn:disabled { opacity:.5; }
    .list { list-style:none; margin:0; padding:0; }
    .list li { display:flex; gap:8px; align-items:center; padding:8px 0; border-bottom:1px solid #eee; }
    .list li:last-child { border-bottom:0; }
    input, select { width:100%; padding:9px 10px; border:1px solid #ccc; border-radius:8px; font-size:15px; }
    .item-edit { display:grid; grid-template-columns:1fr 60px 80px; gap:6px; margin-bottom:8px; }
    .hidden { display:none; }
    .total { font-size:18px; font-weight:700; }
    .toast { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:#333; color:#fff;
             padding:10px 16px; border-radius:10px; opacity:0; transition:.3s; z-index:10; }
    .toast.show { opacity:1; }
    [dir="rtl"] { direction:rtl; text-align:right; }
    /* Login screen */
    #login-screen { max-width:320px; margin:40px auto; padding:24px; }
    #login-screen .card { padding:24px; }
    #login-screen h2 { margin-top:0; text-align:center; color:var(--pri); }
    #login-screen .form-group { margin-bottom:16px; }
    #login-screen label { display:block; margin-bottom:6px; font-weight:500; }
    #login-screen input[type="password"] { width:100%; padding:12px; font-size:16px; }
    #login-screen .btn { width:100%; padding:14px; font-size:16px; }
    #login-screen .error { color:var(--danger); text-align:center; margin-top:12px; font-size:14px; }
  </style>
</head>
<body>
  <!-- Login Screen -->
  <section id="login-screen">
    <div class="card">
      <h2>🔐 Worker Login</h2>
      <div class="form-group">
        <label for="password">Passwort</label>
        <input type="password" id="password" placeholder="Passwort eingeben" autocomplete="current-password" />
      </div>
      <button class="btn" onclick="login()">Anmelden</button>
      <div class="error" id="login-error"></div>
    </div>
  </section>

  <!-- App Screen (hidden until logged in) -->
  <section id="app-screen" class="hidden">
    <header>
      <h1>Market2</h1>
      <div class="tabs">
        <button id="tab-drafts" class="active" onclick="switchTab('drafts')">Bestellungen</button>
        <button id="tab-driver" onclick="switchTab('driver')">Fahrer</button>
      </div>
    </header>

    <main>
      <!-- DRAFTS -->
      <section id="view-drafts">
        <div id="orders"></div>
      </section>

      <!-- DRIVER -->
      <section id="view-driver" class="hidden">
        <div class="card">
          <div class="row"><strong>Lieferungen</strong>
            <select id="roundFilter" onchange="loadDriver()"></select>
          </div>
        </div>
        <div id="driverOrders"></div>
      </section>

      <!-- DETAIL -->
      <section id="view-detail" class="hidden">
        <button class="btn sec" onclick="back()">← Zurück</button>
        <div id="detail"></div>
      </section>
    </main>
  </section>

  <div class="toast" id="toast"></div>

  <script>
    const REF = id => (id || "").slice(0, 8).toUpperCase();
    const fmt = n => (Number(n) || 0).toFixed(2).replace(".", ",") + " €";
    let current = null;
    let authToken = null;

    // --- Auth ---
    async function login() {
      const password = document.getElementById("password").value;
      const errEl = document.getElementById("login-error");
      errEl.textContent = "";
      try {
        const r = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password })
        });
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || "Login fehlgeschlagen");
        authToken = data.token;
        localStorage.setItem("worker_token", authToken);
        showApp();
      } catch (e) {
        errEl.textContent = e.message;
      }
    }

    function showApp() {
      document.getElementById("login-screen").classList.add("hidden");
      document.getElementById("app-screen").classList.remove("hidden");
      loadOrders();
    }

    // Check for saved token on load
    window.addEventListener("load", () => {
      const saved = localStorage.getItem("worker_token");
      if (saved) {
        authToken = saved;
        showApp();
      }
    });

    function authHeaders() {
      return authToken ? { "Authorization": `Bearer ${authToken}` } : {};
    }

    // --- Helpers ---
    function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 2000); }
    function switchTab(t) {
      document.getElementById("tab-drafts").classList.toggle("active", t === "drafts");
      document.getElementById("tab-driver").classList.toggle("active", t === "driver");
      document.getElementById("view-drafts").classList.toggle("hidden", t !== "drafts");
      document.getElementById("view-driver").classList.toggle("hidden", t !== "driver");
      document.getElementById("view-detail").classList.add("hidden");
      if (t === "drafts") loadOrders(); else loadDriver();
    }
    function back() {
      document.getElementById("view-detail").classList.add("hidden");
      document.getElementById("view-drafts").classList.remove("hidden");
      loadOrders();
    }

    async function loadOrders() {
      const r = await fetch("/api/orders?status=draft", { headers: authHeaders() });
      const data = await r.json();
      if (r.status === 401) { logout(); return; }
      const el = document.getElementById("orders");
      if (!data.length) { el.innerHTML = '<div class="card muted">Keine offenen Bestellungen.</div>'; return; }
      el.innerHTML = data.map(o => `
        <div class="card" dir="${o.detected_lang === 'ar' ? 'rtl' : 'ltr'}">
          <div class="row">
            <strong>#${REF(o.id)}</strong>
            <span class="lang">${o.detected_lang.toUpperCase()}</span>
          </div>
          <div class="muted">${o.channel} · ${o.customer_phone}</div>
          <div style="margin:6px 0">${escapeHtml(o.raw_text)}</div>
          <button class="btn" onclick="openDetail('${o.id}')">Bearbeiten</button>
        </div>`).join("");
    }

    async function openDetail(id) {
      const r = await fetch("/api/orders/" + id, { headers: authHeaders() });
      if (r.status === 401) { logout(); return; }
      const d = await r.json();
      current = d;
      const rtl = d.order.detected_lang === "ar";
      document.getElementById("view-drafts").classList.add("hidden");
      document.getElementById("view-detail").classList.remove("hidden");
      const items = d.items.map((it, i) => `
        <li>
          <div style="flex:1">
            <div><b>${escapeHtml(it.name_de || it.name)}</b> ${it.source === 'ai' ? '<span class="badge">KI</span>' : ''}</div>
            <div class="muted">${escapeHtml(it.name)} ${it.brand ? '· ' + escapeHtml(it.brand) : ''}</div>
          </div>
          <input type="number" step="0.01" value="${it.qty}" data-i="${i}" data-f="qty" style="width:60px" />
          <input type="number" step="0.01" placeholder="€" value="${it.price ?? ''}" data-i="${i}" data-f="price" style="width:80px" />
          <button class="btn danger" style="padding:6px 8px" onclick="delItem('${it.id}')">✕</button>
        </li>`).join("");

      document.getElementById("detail").innerHTML = `
        <div class="card" dir="${rtl ? 'rtl' : 'ltr'}">
          <div class="row"><strong>#${REF(d.order.id)}</strong><span class="lang">${d.order.detected_lang.toUpperCase()}</span></div>
          <div class="muted">${d.order.channel} · ${d.customer.phone}</div>
          <h3>Artikel</h3>
          <ul class="list" id="itemList">${items}</ul>
          <button class="btn sec" onclick="addItem()">+ Artikel</button>
        </div>
        <div class="card">
          <h3>Abwicklung</h3>
          <label>Art</label>
          <select id="fulfillment">
            <option value="delivery">Lieferung</option>
            <option value="pickup">Abholung</option>
          </select>
          <div id="roundWrap" style="margin-top:8px">
            <label>Runde</label>
            <select id="roundTime"></select>
          </div>
          <label style="margin-top:8px;display:block">Zahlung</label>
          <select id="payment">
            <option value="Bar">Bar (POS)</option>
            <option value="Karte">Karte (POS)</option>
            <option value="EC">EC (POS)</option>
          </select>
          <label style="margin-top:8px;display:block">Adresse (Lieferung)</label>
          <input id="address" placeholder="Straße, Hausnr." />
          <div class="total" style="margin-top:10px" id="pricePreview">Zwischensumme: –</div>
        </div>
        <button class="btn" style="width:100%" onclick="plan()">Preis berechnen & weiter</button>
        <button class="btn sec" style="width:100%;margin-top:8px" onclick="confirmOrder()">Zusammenfassung senden</button>
      `;
      loadRounds();
      document.getElementById("fulfillment").onchange = toggleRound;
      recalcPreview();
    }

    async function loadRounds() {
      const r = await fetch("/api/rounds", { headers: authHeaders() });
      if (r.status === 401) { logout(); return; }
      const slots = await r.json();
      const sel = document.getElementById("roundTime");
      sel.innerHTML = slots.filter(s => s.available)
        .map(s => `<option value="${s.time}">${new Date(s.time).toLocaleString("de-DE", {weekday:"short",hour:"2-digit",minute:"2-digit"})} (schließt ${new Date(s.cutoff).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"})})</option>`).join("");
    }
    function toggleRound() {
      const f = document.getElementById("fulfillment").value;
      document.getElementById("roundWrap").style.display = f === "delivery" ? "block" : "none";
    }

    function getItemUpdates() {
      const upd = [];
      document.querySelectorAll("#itemList [data-i]").forEach(inp => {
        const i = +inp.dataset.i, f = inp.dataset.f;
        upd.push([i, f, inp.value]);
      });
      return upd;
    }
    async function saveItems() {
      for (const [i, f, v] of getItemUpdates()) {
        const it = current.items[i];
        const body = { qty: it.qty, price: it.price, brand: it.brand, nameDe: it.name_de };
        body[f] = (f === "qty") ? Number(v) : (v === "" ? null : Number(v));
        const r = await fetch(`/api/orders/${current.order.id}/items/${it.id}`, {
          method: "PUT", headers: { "Content-Type": "application/json", ...authHeaders() }, body: JSON.stringify(body)
        });
        if (r.status === 401) { logout(); return; }
      }
      const r = await fetch("/api/orders/" + current.order.id, { headers: authHeaders() });
      if (r.status === 401) { logout(); return; }
      current = await r.json();
    }
    async function delItem(itemId) {
      const r = await fetch(`/api/orders/${current.order.id}/items/${itemId}`, { method: "DELETE", headers: authHeaders() });
      if (r.status === 401) { logout(); return; }
      const r2 = await fetch("/api/orders/" + current.order.id, { headers: authHeaders() });
      if (r2.status === 401) { logout(); return; }
      current = await r2.json(); openDetail(current.order.id);
    }
    async function addItem() {
      await saveItems();
      const name = prompt("Artikelname:");
      if (!name) return;
      const r = await fetch(`/api/orders/${current.order.id}/items`, {
        method: "POST", headers: { "Content-Type": "application/json", ...authHeaders() },
        body: JSON.stringify({ name, nameDe: name, qty: 1 })
      });
      if (r.status === 401) { logout(); return; }
      const r2 = await fetch("/api/orders/" + current.order.id, { headers: authHeaders() });
      if (r2.status === 401) { logout(); return; }
      current = await r2.json(); openDetail(current.order.id);
    }
    function recalcPreview() {
      let sub = 0;
      document.querySelectorAll("#itemList [data-i]").forEach(inp => {
        if (inp.dataset.f === "qty") {}
      });
      const items = current.items;
      const qtyByIndex = {};
      document.querySelectorAll("#itemList [data-f='qty']").forEach(i => qtyByIndex[i.dataset.i] = Number(i.value) || 0);
      const priceByIndex = {};
      document.querySelectorAll("#itemList [data-f='price']").forEach(i => priceByIndex[i.dataset.i] = Number(i.value) || 0);
      items.forEach((it, i) => { sub += (priceByIndex[i] || 0) * (qtyByIndex[i] || 0); });
      const fee = document.getElementById("fulfillment").value === "pickup" ? 0 : (sub >= 50 ? 0 : 3);
      document.getElementById("pricePreview").textContent = `Zwischensumme: ${fmt(sub)}  ·  Lieferung: ${fmt(fee)}  ·  Gesamt: ${fmt(sub + fee)}`;
    }
    document.addEventListener("input", e => { if (e.target.dataset && e.target.dataset.f) recalcPreview(); });

    async function plan() {
      await saveItems();
      const body = {
        fulfillment: document.getElementById("fulfillment").value,
        roundTime: document.getElementById("fulfillment").value === "delivery" ? document.getElementById("roundTime").value : null,
        paymentMethod: document.getElementById("payment").value,
        address: document.getElementById("address").value || null,
      };
      const r = await fetch(`/api/orders/${current.order.id}/plan`, {
        method: "POST", headers: { "Content-Type": "application/json", ...authHeaders() }, body: JSON.stringify(body)
      });
      if (r.status === 401) { logout(); return; }
      const j = await r.json();
      toast("Preis gespeichert");
      back();
    }
    async function confirmOrder() {
      const r = await fetch(`/api/orders/${current.order.id}/confirm`, { method: "POST", headers: authHeaders() });
      if (r.status === 401) { logout(); return; }
      if (!r.ok) { toast("Fehler beim Senden"); return; }
      toast("Zusammenfassung gesendet");
      back();
    }

    async function loadDriver() {
      const r = await fetch("/api/orders?status=confirmed", { headers: authHeaders() });
      if (r.status === 401) { logout(); return; }
      const all = await r.json();
      const r2 = await fetch("/api/orders?status=assigned", { headers: authHeaders() });
      if (r2.status === 401) { logout(); return; }
      const assigned = await r2.json();
      const orders = [...all, ...assigned];
      const sel = document.getElementById("roundFilter");
      const rounds = [...new Set(orders.map(o => o.round_time).filter(Boolean))].sort();
      sel.innerHTML = `<option value="">Alle Runden</option>` + rounds.map(t => `<option value="${t}">${new Date(t).toLocaleString("de-DE",{weekday:"short",hour:"2-digit",minute:"2-digit"})}</option>`).join("");
      renderDriver(sel.value);
    }
    async function renderDriver(filter) {
      const q = filter ? `?roundTime=${encodeURIComponent(filter)}` : "";
      const r = await fetch("/api/driver" + q, { headers: authHeaders() });
      if (r.status === 401) { logout(); return; }
      const orders = await r.json();
      const el = document.getElementById("driverOrders");
      if (!orders.length) { el.innerHTML = '<div class="card muted">Keine Lieferungen.</div>'; return; }
      el.innerHTML = orders.map(o => `
        <div class="card">
          <div class="row"><strong>#${REF(o.id)}</strong>
            <span class="badge">${o.status}</span></div>
          <div class="muted">${o.address || "(keine Adresse)"} · ${o.customer_phone}</div>
          <div class="total">${fmt(o.total)} · ${o.payment_method || ""}</div>
          <div style="display:flex;gap:8px;margin-top:8px">
            <button class="btn sec" onclick="setStatus('${o.id}','picking')">Übernommen</button>
            <button class="btn" onclick="setStatus('${o.id}','delivered')">Geliefert</button>
          </div>
        </div>`).join("");
    }
    document.getElementById("roundFilter").onchange = e => renderDriver(e.target.value);
    async function setStatus(id, status) {
      const r = await fetch(`/api/orders/${id}/status`, { method:"POST", headers:{"Content-Type":"application/json", ...authHeaders()}, body: JSON.stringify({ status }) });
      if (r.status === 401) { logout(); return; }
      toast(status); loadDriver();
    }

    function escapeHtml(s) { return (s||"").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

    loadOrders();
  </script>
</body>
</html>
